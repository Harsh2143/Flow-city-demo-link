<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlowCity — AI Crowd Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-elevated: rgba(255,255,255,0.92);
      --border: rgba(0,0,0,0.08);
      --text: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-tertiary: #86868b;
      --accent: #0071e3;
      --accent-soft: rgba(0,113,227,0.12);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 24px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
      --shadow-lg: 0 12px 48px rgba(0,0,0,0.12), 0 4px 16px rgba(0,0,0,0.06);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: 'JetBrains Mono', monospace;
      --risk-low: #34c759;
      --risk-low-bg: rgba(52,199,89,0.12);
      --risk-medium: #ff9f0a;
      --risk-medium-bg: rgba(255,159,10,0.12);
      --risk-high: #ff3b30;
      --risk-high-bg: rgba(255,59,48,0.12);
      --risk-critical: #8b0000;
      --risk-critical-bg: rgba(139,0,0,0.12);
      --transition: cubic-bezier(0.4, 0, 0.2, 1);
      --nav-h: 64px;
      --sidebar-w: 320px;
      --panel-w: 380px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .leaflet-container { background: #e8e8ed; font-family: var(--font); }

  /* Custom markers */
    .fc-marker-wrap { background: none !important; border: none !important; }
    .fc-marker {
      position: relative;
      width: 36px;
      height: 44px;
      cursor: pointer;
      transition: transform 0.25s var(--transition);
    }
    .fc-marker:hover { transform: scale(1.15) translateY(-4px); }
    .fc-marker.selected { transform: scale(1.2) translateY(-6px); filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3)); }
    .fc-marker svg { width: 100%; height: 100%; }
    .fc-marker-badge {
      position: absolute;
      top: 2px;
      right: -4px;
      width: 16px;
      height: 16px;
      background: var(--accent);
      color: white;
      font-size: 9px;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
      font-family: var(--mono);
    }

    .fc-tooltip {
      font-family: var(--font);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      background: var(--surface);
      min-width: 160px;
    }
    .fc-tooltip strong { display: block; font-size: 13px; margin-bottom: 6px; }
    .fc-tooltip span { font-size: 12px; color: var(--text-secondary); display: block; line-height: 1.5; }

  /* Top Nav */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--surface-elevated);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .logo-block { display: flex; flex-direction: column; gap: 0; min-width: 180px; }
    .logo-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    .logo-sub { font-size: 11px; color: var(--text-secondary); font-weight: 500; }

    .view-tabs {
      display: flex;
      background: rgba(0,0,0,0.05);
      border-radius: var(--radius-md);
      padding: 3px;
      gap: 2px;
    }
    .view-tab {
      padding: 8px 20px;
      border: none;
      background: transparent;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s var(--transition);
    }
    .view-tab:hover { color: var(--text); }
    .view-tab.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
    }

    .nav-right { display: flex; align-items: center; gap: 20px; min-width: 180px; justify-content: flex-end; }
    .live-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .live-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(0,113,227,0.5); }
      50% { opacity: 0.8; transform: scale(1.1); box-shadow: 0 0 0 8px rgba(0,113,227,0); }
    }
    .live-clock {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.02em;
    }

  /* Search */
    .search-wrap {
      position: fixed;
      top: calc(var(--nav-h) + 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      width: min(420px, calc(100% - 40px));
    }
    .search-input {
      width: 100%;
      padding: 12px 20px 12px 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface-elevated);
      backdrop-filter: blur(20px);
      font-family: var(--font);
      font-size: 14px;
      color: var(--text);
      box-shadow: var(--shadow-md);
      transition: border-color 0.2s var(--transition), box-shadow 0.2s var(--transition);
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: var(--shadow-md), 0 0 0 3px var(--accent-soft);
    }
    .search-input::placeholder { color: var(--text-tertiary); }
    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      pointer-events: none;
    }

  /* Filter chips */
    .filter-chips {
      position: fixed;
      top: calc(var(--nav-h) + 68px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 998;
      display: flex;
      gap: 8px;
      max-width: calc(100% - 40px);
      overflow-x: auto;
      padding: 4px 8px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface-elevated);
      backdrop-filter: blur(12px);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s var(--transition);
      white-space: nowrap;
    }
    .chip:hover { border-color: rgba(0,0,0,0.15); color: var(--text); }
    .chip.active {
      background: var(--text);
      color: white;
      border-color: var(--text);
    }

  /* Event sidebar */
    .event-sidebar {
      position: fixed;
      top: calc(var(--nav-h) + 8px);
      left: 12px;
      bottom: 12px;
      width: var(--sidebar-w);
      z-index: 997;
      display: flex;
      flex-direction: column;
      background: var(--surface-elevated);
      backdrop-filter: blur(20px) saturate(180%);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transition: transform 0.35s var(--transition), opacity 0.35s var(--transition);
    }
    .event-sidebar.hidden { transform: translateX(calc(-100% - 24px)); opacity: 0; pointer-events: none; }

    .sidebar-header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .event-count { font-family: var(--mono); font-size: 11px; background: rgba(0,0,0,0.06); padding: 2px 8px; border-radius: 10px; }

    .event-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      scrollbar-width: thin;
    }
    .event-list::-webkit-scrollbar { width: 4px; }
    .event-list::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }

    .event-card {
      padding: 14px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.25s var(--transition);
      margin-bottom: 4px;
    }
    .event-card:hover { background: rgba(0,0,0,0.03); }
    .event-card.selected {
      background: var(--accent-soft);
      border-color: rgba(0,113,227,0.2);
      box-shadow: var(--shadow-sm);
    }
    .event-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .event-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
    .event-venue { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; }
    .event-badges { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-ticketed { background: var(--accent-soft); color: var(--accent); }
    .badge-low { background: var(--risk-low-bg); color: var(--risk-low); }
    .badge-medium { background: var(--risk-medium-bg); color: var(--risk-medium); }
    .badge-high { background: var(--risk-high-bg); color: var(--risk-high); }
    .badge-critical { background: var(--risk-critical-bg); color: var(--risk-critical); }
    .event-score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .event-score { font-family: var(--mono); font-size: 20px; font-weight: 600; }
    .event-trend { font-size: 12px; font-weight: 500; }
    .trend-rising { color: var(--risk-high); }
    .trend-stable { color: var(--text-secondary); }
    .trend-easing { color: var(--risk-low); }

  /* Detail panel (Citizen) */
    .detail-panel {
      position: fixed;
      top: calc(var(--nav-h) + 8px);
      right: 12px;
      bottom: 12px;
      width: var(--panel-w);
      z-index: 997;
      background: var(--surface-elevated);
      backdrop-filter: blur(20px) saturate(180%);
      border-radius: var(--radius-xl);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      transform: translateX(calc(100% + 24px));
      opacity: 0;
      transition: transform 0.4s var(--transition), opacity 0.4s var(--transition);
      display: flex;
      flex-direction: column;
    }
    .detail-panel.open { transform: translateX(0); opacity: 1; }

    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      scrollbar-width: thin;
    }
    .panel-scroll::-webkit-scrollbar { width: 4px; }
    .panel-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 28px;
      height: 28px;
      border: none;
      background: rgba(0,0,0,0.06);
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 2;
    }
    .panel-close:hover { background: rgba(0,0,0,0.1); }

    .panel-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; padding-right: 36px; }
    .panel-venue { font-size: 13px; color: var(--text-secondary); margin-bottom: 20px; }

    .score-ring-wrap {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 20px;
      padding: 16px;
      background: rgba(0,0,0,0.02);
      border-radius: var(--radius-lg);
    }
    .score-ring {
      position: relative;
      width: 88px;
      height: 88px;
      flex-shrink: 0;
    }
    .score-ring svg { transform: rotate(-90deg); }
    .score-ring-bg { fill: none; stroke: rgba(0,0,0,0.08); stroke-width: 6; }
    .score-ring-fill {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 251.2;
      stroke-dashoffset: 251.2;
      transition: stroke-dashoffset 1s var(--transition), stroke 0.3s;
    }
    .score-ring-text {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .score-ring-value { font-family: var(--mono); font-size: 22px; font-weight: 700; line-height: 1; }
    .score-ring-label { font-size: 10px; color: var(--text-tertiary); }
    .score-meta { flex: 1; }
    .score-risk { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .score-wait { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
    .trend-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(0,0,0,0.05);
    }

    .stampede-alert {
      background: linear-gradient(135deg, rgba(139,0,0,0.12), rgba(255,59,48,0.08));
      border: 1px solid rgba(139,0,0,0.25);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 20px;
      animation: alertPulse 3s ease-in-out infinite;
    }
    @keyframes alertPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(139,0,0,0); }
      50% { box-shadow: 0 0 0 4px rgba(139,0,0,0.1); }
    }
    .stampede-alert h4 { font-size: 14px; color: var(--risk-critical); margin-bottom: 6px; }
    .stampede-alert p { font-size: 13px; color: var(--text-secondary); }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-tertiary);
      margin-bottom: 12px;
      margin-top: 20px;
    }
    .section-title:first-of-type { margin-top: 0; }

    .ticket-scans {
      background: rgba(0,0,0,0.02);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 4px;
    }
    .scan-stats { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; }
    .scan-stats strong { font-family: var(--mono); }
    .progress-bar {
      height: 6px;
      background: rgba(0,0,0,0.08);
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
      transition: width 0.8s var(--transition);
    }

    .gate-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      margin-bottom: 8px;
      transition: border-color 0.2s;
    }
    .gate-card.warn { border-color: var(--risk-medium); background: var(--risk-medium-bg); }
    .gate-card.danger { border-color: var(--risk-critical); background: var(--risk-critical-bg); }
    .gate-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .gate-name { font-size: 13px; font-weight: 600; }
    .gate-status {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .gate-status.ok { background: var(--risk-low-bg); color: var(--risk-low); }
    .gate-status.watch { background: var(--risk-medium-bg); color: var(--risk-medium); }
    .gate-status.crush { background: var(--risk-critical-bg); color: var(--risk-critical); }
    .gate-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; color: var(--text-secondary); }
    .gate-util { margin-top: 8px; }
    .gate-util-bar {
      height: 4px;
      background: rgba(0,0,0,0.08);
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }
    .gate-util-fill { height: 100%; border-radius: 2px; transition: width 0.6s var(--transition); }

    .ai-card {
      background: linear-gradient(135deg, rgba(0,113,227,0.08), rgba(0,113,227,0.04));
      border: 1px solid rgba(0,113,227,0.15);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 4px;
    }
    .signal-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .signal-label { width: 110px; flex-shrink: 0; color: var(--text-secondary); }
    .signal-bar-wrap { flex: 1; height: 6px; background: rgba(0,0,0,0.08); border-radius: 3px; overflow: hidden; }
    .signal-bar { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.8s var(--transition); }
    .signal-weight { font-family: var(--mono); font-size: 11px; width: 32px; text-align: right; color: var(--text-tertiary); }
    .ai-verdict { font-size: 13px; line-height: 1.55; color: var(--text); margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,113,227,0.15); }

    .forecast-chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 80px;
      padding: 8px 0;
    }
    .forecast-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .forecast-bar {
      width: 100%;
      max-width: 28px;
      background: rgba(0,113,227,0.2);
      border-radius: 4px 4px 0 0;
      transition: height 0.6s var(--transition);
      min-height: 4px;
    }
    .forecast-bar.current { background: var(--accent); }
    .forecast-label { font-size: 9px; color: var(--text-tertiary); font-family: var(--mono); }

    .time-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .time-chip {
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      background: var(--surface);
      cursor: default;
      transition: all 0.2s;
    }
    .time-chip.best {
      background: var(--risk-low-bg);
      border-color: var(--risk-low);
      color: var(--risk-low);
      font-weight: 600;
    }

    .parking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .parking-item:last-child { border-bottom: none; }
    .parking-state { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
    .parking-available { background: var(--risk-low-bg); color: var(--risk-low); }
    .parking-limited { background: var(--risk-medium-bg); color: var(--risk-medium); }
    .parking-full { background: var(--risk-high-bg); color: var(--risk-high); }

    .alt-item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s var(--transition);
      font-size: 13px;
    }
    .alt-item:hover { border-color: var(--accent); background: var(--accent-soft); }
    .alt-item strong { display: block; margin-bottom: 4px; }
    .alt-item span { font-size: 12px; color: var(--text-secondary); }

  /* Authority dashboard */
    .authority-panel {
      position: fixed;
      top: calc(var(--nav-h) + 8px);
      right: 12px;
      bottom: 12px;
      left: calc(var(--sidebar-w) + 28px);
      z-index: 996;
      display: none;
      flex-direction: column;
      gap: 12px;
      overflow: hidden;
    }
    .authority-panel.visible { display: flex; }

    .auth-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      flex-shrink: 0;
    }
    .stat-card {
      background: var(--surface-elevated);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: var(--shadow-md);
      transition: transform 0.2s var(--transition);
    }
    .stat-card:hover { transform: translateY(-2px); }
    .stat-label { font-size: 12px; color: var(--text-secondary); font-weight: 500; margin-bottom: 6px; }
    .stat-value { font-family: var(--mono); font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
    .stat-card.critical .stat-value { color: var(--risk-critical); }
    .stat-card.watch .stat-value { color: var(--risk-medium); }

  function updateMarker(event) {
    const risk = scoreToRisk(event.score);
    const el = document.getElementById(`marker-${event.id}`);
    if (!el) return;
    el.innerHTML = markerSvg(risk.stroke, event.id === state.selectedId) +
      (event.ticketed ? '<span class="fc-marker-badge">T</span>' : '');
    el.classList.toggle('selected', event.id === state.selectedId);
  }

  function getEvent(id) {
    return events.find(e => e.id === id);
  }

  function getFilteredEvents() {
    return events.filter(e => {
      const matchSearch = !state.search ||
        e.name.toLowerCase().includes(state.search) ||
        e.venue.toLowerCase().includes(state.search);
      let matchFilter = true;
      if (state.filter === 'ticketed') matchFilter = e.ticketed;
      else if (state.filter !== 'all') matchFilter = e.category === state.filter;
      return matchSearch && matchFilter;
    });
  }

  function renderEventList() {
    const list = getFilteredEvents();
    $('#eventCount').textContent = list.length;
    $('#eventList').innerHTML = list.map(e => {
      const risk = scoreToRisk(e.score);
      const tr = trendIcon(e.trend);
      return `<div class="event-card ${e.id === state.selectedId ? 'selected' : ''}" data-id="${e.id}">
        <div class="event-card-top">
          <div class="event-name">${e.name}</div>
        </div>
        <div class="event-venue">${e.venue}</div>
        <div class="event-badges">
          ${e.ticketed ? '<span class="badge badge-ticketed">Ticketed</span>' : ''}
          <span class="badge ${risk.class}">${risk.level}</span>
        </div>
        <div class="event-score-row">
          <span class="event-score">${Math.round(e.score)}</span>
          <span class="event-trend ${tr.cls}">${tr.icon} ${tr.label}</span>
        </div>
      </div>`;
    }).join('');
    $$('.event-card').forEach(card => {
      card.addEventListener('click', () => selectEvent(card.dataset.id));
    });
  }

  function selectEvent(id) {
    state.selectedId = id;
    const event = getEvent(id);
    renderEventList();
    events.forEach(updateMarker);
    state.map.flyTo([event.lat, event.lng], 15, { duration: 1.2 });
    if (state.view === 'citizen') renderCitizenPanel(event);
    if (state.view === 'organizer') renderOrganizerPanel(event);
    if (state.view === 'citizen') {
      $('#detailPanel').classList.add('open');
    }
    if (state.view === 'organizer') {
      $('#organizerPanel').classList.add('open');
    }
  }

  function ringOffset(score) {
    const circ = 2 * Math.PI * 40;
    return circ - (score / 100) * circ;
  }

  function renderCitizenPanel(e) {
    const risk = scoreToRisk(e.score);
    const tr = trendIcon(e.trend);
    const showStampede = e.stampedeMins !== null && e.stampedeMins !== undefined;
    const scanPct = e.ticketed ? Math.round((e.scannedTickets / e.totalTickets) * 100) : 0;
    const incoming = e.ticketed ? Math.round(e.totalTickets * 0.08 + randInt(50, 200)) : 0;

    let html = `
      <h2 class="panel-title">${e.name}</h2>
      <p class="panel-venue">${e.venue}</p>
      <div class="score-ring-wrap">
        <div class="score-ring">
          <svg width="88" height="88" viewBox="0 0 88 88">
            <circle class="score-ring-bg" cx="44" cy="44" r="40"/>
            <circle class="score-ring-fill" cx="44" cy="44" r="40" stroke="${risk.stroke}" style="stroke-dashoffset:${ringOffset(e.score)}"/>
          </svg>
          <div class="score-ring-text">
            <span class="score-ring-value">${Math.round(e.score)}</span>
            <span class="score-ring-label">/ 100</span>
          </div>
        </div>
        <div class="score-meta">
          <div class="score-risk" style="color:${risk.stroke}">${risk.level} Risk</div>
          <div class="score-wait">⏱ ${e.waitTime} min estimated wait</div>
          <span class="trend-badge ${tr.cls}">${tr.icon} ${tr.label}</span>
        </div>
      </div>`;

    if (showStampede) {
      html += `<div class="stampede-alert">
        <h4>🚨 Stampede Risk Alert</h4>
        <p>Prediction: Critical in <strong id="stampedeCountdown">${e.stampedeMins}</strong> minutes</p>
      </div>`;
    }

    if (e.ticketed) {
      html += `
        <div class="section-title">Live Ticket Scans</div>
        <div class="ticket-scans">
          <div class="scan-stats">
            <span>Scanned: <strong>${e.scannedTickets.toLocaleString()}</strong></span>
            <span>Incoming: <strong>${incoming.toLocaleString()}</strong></span>
            <span><strong>${scanPct}%</strong></span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${scanPct}%"></div></div>
        </div>
        <div class="section-title">Gate Intelligence</div>
        ${e.gates.map(g => {
          const status = g.util >= 90 ? 'crush' : g.util >= 75 ? 'watch' : 'ok';
          const statusLabel = status === 'crush' ? 'CRUSH RISK' : status === 'watch' ? 'WATCH' : 'OK';
          const cardCls = status === 'crush' ? 'danger' : status === 'watch' ? 'warn' : '';
          const barColor = status === 'crush' ? 'var(--risk-critical)' : status === 'watch' ? 'var(--risk-medium)' : 'var(--risk-low)';
          return `<div class="gate-card ${cardCls}">
            <div class="gate-header">
              <span class="gate-name">${g.name}</span>
              <span class="gate-status ${status}">${statusLabel}</span>
            </div>
            <div class="gate-metrics">
              <span>Capacity: ${g.capacity}/hr</span>
              <span>${g.ppm} people/min</span>
              <span>Approaching: ${g.approaching}</span>
              <span>Util: ${Math.round(g.util)}%</span>
            </div>
            <div class="gate-util">
              <div class="gate-util-bar"><div class="gate-util-fill" style="width:${g.util}%;background:${barColor}"></div></div>
            </div>
            ${status !== 'ok' ? `<p style="font-size:11px;color:var(--risk-high);margin-top:8px">⚠ Threshold exceeded — redirect flow recommended</p>` : ''}
          </div>`;
        }).join('')}`;
    }

    html += `
      <div class="section-title">AI Reasoning</div>
      <div class="ai-card">
        ${Object.entries(e.signals).map(([k, v]) => {
          const labels = { popularTimes: 'Popular Times', roadCongestion: 'Road Congestion', ticketScan: 'Ticket Scan Rate', weather: 'Weather' };
          if (!e.ticketed && k === 'ticketScan') return '';
          return `<div class="signal-row">
            <span class="signal-label">${labels[k]}</span>
            <div class="signal-bar-wrap"><div class="signal-bar" style="width:${v}%"></div></div>
            <span class="signal-weight">${v}%</span>
          </div>`;
        }).join('')}
        <p class="ai-verdict">${e.aiVerdict}</p>
      </div>
      <div class="section-title">2-Hour Forecast</div>
      <div class="forecast-chart">
        ${e.forecast.map((v, i) => {
          const labels = ['Now', '+15', '+30', '+45', '+60', '+75', '+90', '+105'];
          return `<div class="forecast-bar-wrap">
            <div class="forecast-bar ${i === 0 ? 'current' : ''}" style="height:${v * 0.75}px" data-val="${v}"></div>
            <span class="forecast-label">${labels[i]}</span>
          </div>`;
        }).join('')}
      </div>
      <div class="section-title">Best Time To Visit</div>
      <div class="time-chips">
        ${e.bestTimes.map((t, i) => `<span class="time-chip ${i === e.bestIndex ? 'best' : ''}">${t}${i === e.bestIndex ? ' ✓' : ''}</span>`).join('')}
      </div>
      <div class="section-title">Parking</div>
      ${e.parking.map(p => `<div class="parking-item">
        <div><strong>${p.name}</strong><br><span style="color:var(--text-secondary);font-size:12px">${p.dist}</span></div>
        <span class="parking-state parking-${p.state}">${p.state.charAt(0).toUpperCase() + p.state.slice(1)}</span>
      </div>`).join('')}`;

    if (e.alternatives && e.alternatives.length) {
      html += `<div class="section-title">Less Crowded Alternatives</div>`;
      html += e.alternatives.map(a => `<div class="alt-item" data-alt="${a.id}">
        <strong>${a.name}</strong><span>${a.desc}</span>
      </div>`).join('');
    }

    $('#panelContent').innerHTML = html;
    $$('.alt-item').forEach(el => {
      el.addEventListener('click', () => selectEvent(el.dataset.alt));
    });
  }

  function renderAuthorityPanel() {
    const critical = events.filter(e => scoreToRisk(e.score).level === 'CRITICAL').length;
    const watch = events.filter(e => { const l = scoreToRisk(e.score).level; return l === 'HIGH' || l === 'MEDIUM'; }).length;
    const footfall = events.reduce((s, e) => s + Math.round(e.score * (e.ticketed ? 400 : 800)), 0);

    $('#authStats').innerHTML = `
      <div class="stat-card critical"><div class="stat-label">Critical Events</div><div class="stat-value">${critical}</div></div>
      <div class="stat-card watch"><div class="stat-label">Watch Events</div><div class="stat-value">${watch}</div></div>
      <div class="stat-card active"><div class="stat-label">Active Events</div><div class="stat-value">${events.length}</div></div>
      <div class="stat-card footfall"><div class="stat-label">Est. Footfall</div><div class="stat-value">${(footfall / 1000).toFixed(0)}K</div></div>`;

    const alerts = generateAlerts();
    $('#alertsList').innerHTML = alerts.map(a => `
      <div class="alert-item ${a.severity}">
        <div class="alert-location">${a.location}</div>
        <div class="alert-severity">${a.severityLabel}</div>
        <div class="alert-rec">${a.message}<br><em style="font-size:11px;margin-top:4px;display:block">→ ${a.recommendation}</em></div>
      </div>`).join('');
  }

  function generateAlerts() {
    const list = [];
    events.forEach(e => {
      if (e.stampedeMins) {
        list.push({
          location: e.name,
          severity: 'critical',
          severityLabel: 'CRITICAL — Stampede Risk',
          message: `Gate crush predicted in ${e.stampedeMins} min at ${e.venue}.`,
          recommendation: 'Deploy rapid response teams and activate emergency crowd dispersion protocol.'
        });
      }
      if (e.ticketed && e.gates) {
        e.gates.forEach(g => {
          if (g.util >= 88) {
            list.push({
              location: `${e.name} — ${g.name}`,
              severity: 'high',
              severityLabel: 'HIGH — Gate Pressure',
              message: `Utilization at ${Math.round(g.util)}%. ${g.approaching} people approaching.`,
              recommendation: 'Open auxiliary entry and redirect incoming flow via secondary routes.'
            });
          }
        });
      }
      if (e.trend === 'rising' && e.score >= 70) {
        list.push({
          location: e.name,
          severity: e.score >= 85 ? 'critical' : 'high',
          severityLabel: e.score >= 85 ? 'CRITICAL — Rapid Escalation' : 'HIGH — Score Rising',
          message: `Crowd score rising rapidly (now ${Math.round(e.score)}/100). Trend: ↑ Rising.`,
          recommendation: 'Increase monitoring frequency and pre-position medical teams.'
        });
      }
    });
    if (events.find(e => e.id === 'ipl')) {
      list.push({
        location: 'MCA Stadium, Gahunje',
        severity: 'critical',
        severityLabel: 'CRITICAL — Mass Exit',
        message: '38,000 spectators projected to exit stadium simultaneously post-match.',
        recommendation: 'Stagger exit waves via PA system. Hold food courts open to absorb flow.'
      });
    }
    return list.slice(0, 12);
  }

  function renderOrganizerPanel(e) {
    if (!e) {
      $('#orgPanelContent').innerHTML = '<p style="color:var(--text-secondary);padding:20px">Select an event from the list to view organizer insights.</p>';
      return;
    }
    const resources = {
      parking: clamp(e.score * 0.9 + rand(-5, 10), 20, 98),
      entryQueue: clamp(e.waitTime * 2.2, 15, 95),
      staffLoad: clamp(e.score * 0.85, 25, 95),
      medical: clamp(e.score * 0.6 + (e.stampedeMins ? 25 : 0), 10, 90)
    };
    const recs = getOrganizerRecs(e);

    $('#orgPanelContent').innerHTML = `
      <h2 class="panel-title">${e.name}</h2>
      <p class="panel-venue">${e.venue}</p>
      <div class="section-title">Footfall Forecast</div>
      <div class="org-chart" id="orgForecast">
        ${e.forecast.map((v, i) => {
          const labels = ['Now', '+15', '+30', '+45', '+60', '+75', '+90', '+105'];
          return `<div class="org-bar-col"><div class="org-bar" style="height:${v * 0.9}px" title="${v}"></div><span class="org-bar-label">${labels[i]}</span></div>`;
        }).join('')}
      </div>
      ${e.ticketed && e.gates ? `
        <div class="section-title">Gate Pressure</div>
        ${e.gates.map(g => {
          const color = g.util >= 90 ? 'var(--risk-critical)' : g.util >= 75 ? 'var(--risk-medium)' : 'var(--risk-low)';
          return `<div class="resource-row">
            <div class="resource-label"><span>${g.name}</span><span>${Math.round(g.util)}%</span></div>
            <div class="resource-bar"><div class="resource-fill" style="width:${g.util}%;background:${color}"></div></div>
          </div>`;
        }).join('')}` : ''}
      <div class="section-title">Resource Stress</div>
      ${[
        { key: 'parking', label: 'Parking' },
        { key: 'entryQueue', label: 'Entry Queue' },
        { key: 'staffLoad', label: 'Staff Load' },
        { key: 'medical', label: 'Medical Cover' }
      ].map(r => {
        const v = resources[r.key];
        const color = v >= 80 ? 'var(--risk-critical)' : v >= 60 ? 'var(--risk-medium)' : 'var(--risk-low)';
        return `<div class="resource-row">
          <div class="resource-label"><span>${r.label}</span><span>${Math.round(v)}%</span></div>
          <div class="resource-bar"><div class="resource-fill" style="width:${v}%;background:${color}"></div></div>
        </div>`;
      }).join('')}
      <div class="section-title">AI Recommendations</div>
      ${recs.map(r => `<div class="rec-item"><span class="rec-icon">${r.icon}</span><span>${r.text}</span></div>`).join('')}`;
  }

  function getOrganizerRecs(e) {
    const recs = [];
    if (e.score >= 75) recs.push({ icon: '👥', text: 'Deploy additional staff 30 minutes before predicted peak crowd window.' });
    if (e.ticketed && e.gates) {
      const worst = e.gates.reduce((a, b) => a.util > b.util ? a : b);
      if (worst.util >= 75) recs.push({ icon: '🚪', text: `Redirect traffic from ${worst.name} to auxiliary gates — utilization at ${Math.round(worst.util)}%.` });
    }
    if (e.stampedeMins) recs.push({ icon: '🛡️', text: 'Activate crowd control barriers and establish one-way pedestrian flow immediately.' });
    recs.push({ icon: '🚑', text: 'Position ambulance at nearest access point with clear lane for emergency vehicles.' });
    if (e.category === 'ganapati' || e.category === 'holi') recs.push({ icon: '📢', text: 'Broadcast PA announcements recommending alternative darshan routes every 15 minutes.' });
    if (e.parking.some(p => p.state === 'full')) recs.push({ icon: '🅿️', text: 'Open overflow parking at secondary lots and deploy shuttle service from remote zones.' });
    return recs.slice(0, 5);
  }

  function setView(view) {
    state.view = view;
    $$('.view-tab').forEach(t => t.classList.toggle('active', t.dataset.view === view));
    $('#detailPanel').classList.remove('open');
    $('#organizerPanel').classList.remove('open');
    $('#authorityPanel').classList.remove('visible');
    $('#eventSidebar').classList.remove('hidden');

    if (view === 'citizen') {
      if (state.selectedId) {
        $('#detailPanel').classList.add('open');
        renderCitizenPanel(getEvent(state.selectedId));
      }
    } else if (view === 'authority') {
      $('#authorityPanel').classList.add('visible');
      renderAuthorityPanel();
    } else if (view === 'organizer') {
      $('#organizerPanel').classList.add('open');
      renderOrganizerPanel(state.selectedId ? getEvent(state.selectedId) : null);
    }
  }

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    $('#toastContainer').appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  function simulate() {
    events.forEach(e => {
      const delta = rand(-4, 5);
      e.score = clamp(e.score + delta, 15, 98);
      e.waitTime = clamp(Math.round(e.waitTime + rand(-3, 4)), 2, 60);

      if (Math.random() > 0.6) {
        e.trend = e.score > 70 ? 'rising' : e.score < 40 ? 'easing' : 'stable';
      }

      if (e.ticketed) {
        const incoming = randInt(80, 350);
        e.scannedTickets = clamp(e.scannedTickets + incoming, 0, e.totalTickets);
        e.scanRate = clamp(Math.round(e.scanRate + rand(-8, 12)), 20, 200);
        if (e.gates) {
          e.gates.forEach(g => {
            g.ppm = clamp(Math.round(g.ppm + rand(-12, 15)), 15, 220);
            g.approaching = clamp(Math.round(g.approaching + rand(-40, 50)), 20, 1200);
            g.util = clamp(g.util + rand(-3, 4), 25, 98);
          });
        }
      }

      if (e.stampedeMins !== null && e.stampedeMins !== undefined) {
        e.stampedeMins = Math.max(3, e.stampedeMins - 1 + (Math.random() > 0.7 ? 1 : 0));
        if (e.score < 80) e.stampedeMins = null;
      } else if (e.score >= 88 && Math.random() > 0.85) {
        e.stampedeMins = randInt(8, 18);
      }

      const shift = randInt(-3, 3);
      e.forecast = e.forecast.map((v, i) => clamp(v + (i === 0 ? delta : shift), 10, 99));

      Object.keys(e.signals).forEach(k => {
        e.signals[k] = clamp(e.signals[k] + randInt(-4, 5), 5, 99);
      });

      updateMarker(e);
    });

    renderEventList();
    if (state.selectedId) {
      const ev = getEvent(state.selectedId);
      if (state.view === 'citizen') renderCitizenPanel(ev);
      if (state.view === 'organizer') renderOrganizerPanel(ev);
    }
    if (state.view === 'authority') renderAuthorityPanel();
  }

  function updateClock() {
    const now = new Date();
    $('#liveClock').textContent = now.toLocaleTimeString('en-IN', { hour12: false });
  }

  $$('.view-tab').forEach(tab => {
    tab.addEventListener('click', () => setView(tab.dataset.view));
  });

  $('#searchInput').addEventListener('input', (ev) => {
    state.search = ev.target.value.toLowerCase().trim();
    renderEventList();
  });

  $$('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      $$('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      state.filter = chip.dataset.filter;
      renderEventList();
    });
  });

  $('#panelClose').addEventListener('click', () => {
    $('#detailPanel').classList.remove('open');
    state.selectedId = null;
    renderEventList();
    events.forEach(updateMarker);
  });

  $('#orgPanelClose').addEventListener('click', () => {
    $('#organizerPanel').classList.remove('open');
  });

  $('#submitOverride').addEventListener('click', () => {
    const text = $('#overrideText').value.trim();
    if (!text) {
      showToast('Please enter intelligence before submitting.');
      return;
    }
    $('#overrideText').value = '';
    showToast('Override submitted — AI recalibrating...');
    setTimeout(() => {
      events.forEach(e => {
        e.score = clamp(e.score + rand(-8, -2), 10, 98);
        if (e.stampedeMins) e.stampedeMins = Math.min(e.stampedeMins + 3, 25);
      });
      renderEventList();
      if (state.view === 'authority') renderAuthorityPanel();
      if (state.selectedId && state.view === 'citizen') renderCitizenPanel(getEvent(state.selectedId));
    }, 1500);
  });

  initMap();
  renderEventList();
  updateClock();
  setInterval(updateClock, 1000);
  setInterval(simulate, 30000);

  setTimeout(() => selectEvent('ipl'), 800);
})();
  </script>
</body>
</html>
